name: build-toolchain

# Builds Linux Rust toolchains (gnu + musl hosts) on a Linux runner and
# publishes them as Release assets, so sandboxes can pull the one matching their
# libc instead of running rustup each time. Each asset bundles rustfmt + clippy
# and BOTH std targets (gnu + musl), so it can build for either libc offline.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "rustup toolchain (e.g. 1.97.1, stable)"
        default: "1.97.1"
        required: true

permissions:
  contents: write   # required to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build gnu and musl host toolchains
        run: |
          set -euo pipefail
          TC="${{ inputs.toolchain }}"
          for HOST in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            LIBC="${HOST##*-}"                     # gnu or musl
            STAGE="$PWD/stage-$LIBC"
            export RUSTUP_HOME="$STAGE/rustup" CARGO_HOME="$STAGE/cargo"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-host "$HOST" --default-toolchain "$TC" \
                  --profile minimal --component rustfmt --component clippy \
                  --no-modify-path
            # Bundle both std targets so either libc can be a build target offline.
            "$CARGO_HOME/bin/rustup" target add \
              x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
            "$CARGO_HOME/bin/cargo" --version
            "$CARGO_HOME/bin/cargo" fmt --version
            "$CARGO_HOME/bin/cargo" clippy --version
            tar -C "$STAGE" -c --zstd \
              -f "rust-$TC-linux-x86_64-$LIBC.tar.zst" cargo rustup
          done
          ls -lh rust-*.tar.zst

      - name: Publish Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.toolchain }}
          files: rust-*.tar.zst
