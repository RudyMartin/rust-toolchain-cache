name: build-toolchain

# Builds Linux Rust toolchains and publishes them as Release assets so sandboxes
# can pull the one matching their libc instead of running rustup each time.
#
#   * gnu  host toolchain  -> built natively on Ubuntu (glibc)
#   * musl host toolchain  -> built natively in an Alpine container (musl)
#
# Each asset bundles rustfmt + clippy and BOTH std targets (gnu + musl), so it
# can build for either libc offline. musl-host binaries cannot be built or run
# on a glibc host (they need musl's loader + libgcc), hence the two environments.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "rustup toolchain (e.g. 1.97.1, stable)"
        default: "1.97.1"
        required: true
  schedule:
    # Monthly rebuild (06:00 UTC on the 1st) as a build canary: verifies the
    # rustup URLs, Alpine deps, and action versions still work, and keeps the
    # release assets present. schedule runs cannot pass inputs, so the jobs fall
    # back to the pinned default (see `inputs.toolchain || '1.97.1'`).
    - cron: "0 6 1 * *"

permissions:
  contents: write   # required to create the Release

jobs:
  build-gnu:
    runs-on: ubuntu-latest
    steps:
      - name: Build gnu-host toolchain
        shell: bash
        run: |
          set -euo pipefail
          TC="${{ inputs.toolchain || '1.97.1' }}"
          export RUSTUP_HOME="$PWD/stage/rustup" CARGO_HOME="$PWD/stage/cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-host x86_64-unknown-linux-gnu \
                --default-toolchain "$TC" --profile minimal \
                --component rustfmt --component clippy --no-modify-path
          "$CARGO_HOME/bin/rustup" target add \
            x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          "$CARGO_HOME/bin/cargo" --version
          "$CARGO_HOME/bin/cargo" fmt --version
          "$CARGO_HOME/bin/cargo" clippy --version
          tar -C stage -c --zstd -f "rust-$TC-linux-x86_64-gnu.tar.zst" cargo rustup
          ls -lh rust-*.tar.zst
      - name: Publish gnu asset
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.toolchain }}
          files: rust-*.tar.zst

  build-musl:
    needs: build-gnu          # serialize release creation; isolate from gnu asset
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - name: Install build deps (native musl env)
        run: apk add --no-cache bash curl gcc musl-dev tar zstd libgcc
      - name: Build musl-host toolchain
        shell: bash
        run: |
          set -euo pipefail
          TC="${{ inputs.toolchain || '1.97.1' }}"
          export RUSTUP_HOME="$PWD/stage/rustup" CARGO_HOME="$PWD/stage/cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-host x86_64-unknown-linux-musl \
                --default-toolchain "$TC" --profile minimal \
                --component rustfmt --component clippy --no-modify-path
          "$CARGO_HOME/bin/rustup" target add \
            x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          "$CARGO_HOME/bin/cargo" --version
          "$CARGO_HOME/bin/cargo" fmt --version
          "$CARGO_HOME/bin/cargo" clippy --version
          tar -C stage -c --zstd -f "rust-$TC-linux-x86_64-musl.tar.zst" cargo rustup
          ls -lh rust-*.tar.zst
      - name: Publish musl asset
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ inputs.toolchain }}
          files: rust-*.tar.zst
